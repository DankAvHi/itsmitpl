x-env: &env
  env_file: [.env.development.local]

services:
  postgres:
    <<: *env
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  migrate: *env
  seed: *env
  backend: *env
  proxy:
    ports: ['8080:8080']
    volumes: ['./dev.Caddyfile:/etc/caddy/Caddyfile:Z']

volumes:
  pgdata:
