x-env: &env
  env_file: [.env]

services:
  postgres:
    <<: *env
    restart: always
    volumes: ['./work_data/pg:/var/lib/postgresql/data']
  migrate: *env
  seed: *env
  backend:
    <<: *env
    restart: always
  proxy:
    restart: unless-stopped
    ports: ['8443:443', '8880:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - ./work_data/proxy/data:/data
      - ./work_data/proxy/config:/config
